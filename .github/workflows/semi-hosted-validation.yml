name: Semi currency native fix comparison
on:
  push:
    branches: [verify/semi-currency-native-20261007]
permissions:
  contents: read
concurrency:
  group: semi-currency-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    name: Frozen base, candidate, negative and broader checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_REPOSITORY: dvd233/flowgram.ai
      EXPECTED_REPOSITORY_ID: '1352889832'
      EXPECTED_OWNER_ID: '111864431'
      EXPECTED_REF: refs/heads/verify/semi-currency-native-20261007
    steps:
      - name: Check exact repository, push, ref and GitHub-hosted Linux X64
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$EXPECTED_OWNER_ID"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          assert event['after'] == os.environ['GITHUB_SHA']
          assert event['ref'] == os.environ['EXPECTED_REF']
          assert not event.get('deleted')
          assert event['repository']['full_name'] == os.environ['EXPECTED_REPOSITORY']
          assert str(event['repository']['id']) == os.environ['EXPECTED_REPOSITORY_ID']
          assert str(event['repository']['owner']['id']) == os.environ['EXPECTED_OWNER_ID']
          assert event['repository']['private'] is False
          PY
      - name: Checkout exact validation payload without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # official v4.2.2
        with:
          ref: ${{ github.sha }}
          path: payload
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Checkout exact public upstream source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # official v4.2.2
        with:
          repository: DouyinFE/semi-design
          ref: 2a4ec36222a439098e8aaea236518c66752854ca
          path: source
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Set exact Node runtime without project caches
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # official v4.4.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Run frozen native base, candidate and negative comparisons
        id: native
        shell: bash
        run: python3 payload/semi-hosted-validation/run.py "$GITHUB_WORKSPACE/source"
      - name: Upload bounded receipts and native evidence only
        if: ${{ always() && steps.native.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4.6.2
        with:
          name: semi-currency-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semi-foundation-red.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          include-hidden-files: false
